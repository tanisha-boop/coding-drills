<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaTech Employee Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1 id="companyName"></h1>

<p id="companyInfo"></p>

</header>

<div class="container">

<div class="stats">

<div class="stat-card">

<h3>Total Employees</h3>

<p id="employeeCount"></p>

</div>

<div class="stat-card">

<h3>Active Projects</h3>

<p id="projectCount"></p>

</div>

<div class="stat-card">

<h3>Departments</h3>

<p id="departmentCount"></p>

</div>

</div>

<section>

<h2>Departments</h2>

<ul id="departments"></ul>

</section>

<section>

<h2>Employees</h2>

<div id="employees"></div>

</section>

<section>

<h2>Projects</h2>

<div id="projects"></div>

</section>

</div>

<script src="script.js"></script>

</body>

</html>
